name: 99 - Limpiar recursos del alumno
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Escribe DELETE- seguido de tu sufijo, ej. DELETE-07
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mod7-aws-${{ github.repository }}
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Borrar solo recursos con sufijo correcto
        env:
          SUFFIX: ${{ vars.SUFFIX }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CATALOG_BUCKET: ${{ vars.CATALOG_BUCKET }}
          CONFIRM_CLEANUP: ${{ inputs.confirmation }}
        run: bash scripts/99-cleanup.sh
